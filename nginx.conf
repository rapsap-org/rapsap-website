server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik (neevpanel) terminates TLS; keep redirects on the public scheme/host.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Clean URLs: /about -> about.html, and /about.html -> /about is not forced.
    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML is never cached hard so a deploy is visible immediately.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite output is content-hashed -> cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Self-hosted fonts: stable names, long cache.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Other static files (favicon, og image, verification file).
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|pdf)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
